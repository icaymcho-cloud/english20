<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>매일 20분 영어회화</title>
<meta name="theme-color" content="#1f3a8a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f5f6fa;--card:#fff;--ink:#16203a;--sub:#5d6680;--line:#e3e6ee;--pri:#1f3a8a;--pri2:#3557c7;--ok:#16794a;--bad:#c0392b;--warn:#b26a00;--soft:#eef2ff}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5;padding-bottom:calc(70px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--pri);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
header h1{font-size:17px;margin:0 0 6px}
.timer{display:flex;align-items:center;gap:10px;font-size:13px}
.bar{flex:1;height:8px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:#7dd3a8;width:0}
main{padding:12px;max-width:720px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:16px;margin:4px 0 10px}
h3{font-size:15px;margin:0 0 6px}
.muted{color:var(--sub);font-size:13px}
.step{display:inline-block;background:var(--soft);color:var(--pri);font-weight:700;font-size:12px;border-radius:99px;padding:2px 10px;margin-bottom:6px}
.en{font-size:19px;font-weight:600;margin:4px 0}
.en .w{cursor:pointer;border-radius:4px;padding:0 1px}
.en .w:active{background:#dbe4ff}
.hide-en .en{filter:blur(7px)}
.hide-en .en.reveal{filter:none}
.ko{color:var(--sub);font-size:14px}
.tip{background:#fff8e6;border-left:3px solid #f0b429;padding:6px 10px;border-radius:6px;font-size:13px;margin:8px 0}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
button,.lnk{font:inherit;font-size:14px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
button.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
button.mic{background:#fff0f0;border-color:#f3c2c2;color:#a8261b}
button.mic.on{background:#c0392b;color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.7}}
button:disabled{opacity:.45}
.result{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;display:none}
.result.show{display:block}
.score{font-weight:800}
.ok{color:var(--ok)} .bad{color:var(--bad)} .warn{color:var(--warn)}
.diff span{padding:0 2px;border-radius:3px}
.diff .m{background:#e3f6ec}
.diff .x{background:#fde4e1;text-decoration:underline wavy var(--bad)}
.analysis li{margin-bottom:6px;font-size:14px}
.recs audio{width:100%;height:36px;margin-top:4px}
.settings{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px}
.settings label{display:flex;flex-direction:column;gap:2px}
select,input[type=range]{font:inherit;width:100%}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;border:0;border-radius:0;flex-direction:column;font-size:12px;padding:8px 0;color:var(--sub);gap:0}
nav button b{font-size:20px;font-weight:400}
nav button.act{color:var(--pri);font-weight:700}
.locked{opacity:.5;pointer-events:none}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{background:var(--soft);border-radius:12px;padding:10px}
.stat b{display:block;font-size:22px;color:var(--pri)}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.heat i{aspect-ratio:1;border-radius:4px;background:#e8eaf0;font-style:normal;font-size:10px;display:flex;align-items:center;justify-content:center;color:#889}
.heat i.l1{background:#c7e9d5}.heat i.l2{background:#7cc8a0}.heat i.l3{background:#2f9e65;color:#fff}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.pbar{height:10px;background:#e8eaf0;border-radius:99px;overflow:hidden;margin:6px 0}
.pbar>i{display:block;height:100%;background:var(--pri2)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#16203a;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;display:none;z-index:9;max-width:90%}
.done-badge{background:#e3f6ec;color:var(--ok);border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700}
.sumlist li{margin-bottom:6px}
</style>
</head>
<body>
<header>
  <h1>🗣️ 매일 20분 영어회화</h1>
  <div class="timer"><span id="tmText">오늘 0:00 / 20:00</span><div class="bar"><i id="tmBar"></i></div></div>
</header>
<main id="main"></main>
<nav>
  <button data-tab="today" class="act"><b>📘</b>오늘 학습</button>
  <button data-tab="progress"><b>📈</b>진행도</button>
  <button data-tab="history"><b>🎙️</b>말하기 기록</button>
  <button data-tab="more"><b>⚙️</b>설정·채널</button>
</nav>
<div class="toast" id="toast"></div>
<script src="lessons.js"></script>
<script src="app.js"></script>
</body>
</html>
